<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ titulo }}</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 3rem 1rem;
    background: #ffffff;
    color: #1a1a1a;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 600px;
  }

  h1 {
    font-size: 2rem;
    margin: 0 0 1.5rem;
  }

  form {
    display: flex;
    gap: 0.5rem;
  }

  input[type="url"] {
    flex: 1;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    border: 1px solid #d0d0d0;
    border-radius: 6px;
    font-family: inherit;
  }

  input[type="url"]:focus {
    outline: none;
    border-color: #1a1a1a;
  }

  button {
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    font-weight: 600;
    color: #ffffff;
    background: #1a1a1a;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  button:hover {
    background: #333333;
  }

  .erro {
    color: #d32f2f;
    margin-bottom: 1rem;
  }

  .stat-box {
    padding: 1rem 0;
    border-bottom: 1px solid #eeeeee;
  }

  .stat-box:last-of-type {
    border-bottom: none;
  }

  .label {
    display: block;
    font-size: 0.85rem;
    color: #888888;
    margin-bottom: 0.25rem;
  }

  .short-url {
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    color: #1a1a1a;
    word-break: break-all;
  }

  .short-url:hover {
    text-decoration: underline;
  }

  .original-url {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  a {
    color: #1a1a1a;
  }

  .voltar {
    display: inline-block;
    margin-top: 1.5rem;
  }
</style>
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
